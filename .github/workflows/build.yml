name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp:
    name: Testes de DSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Os headers de dsp/, track/ e karaoke/ nao dependem de Android, entao a
      # parte que pode quebrar em silencio e testada sem emulador nem SDK
      - run: tools/run_tests.sh

      # Os ids em Params.h e Param.kt sao toda a interface entre o motor e as
      # telas, e nenhuma das duas linguagens reclama quando eles divergem: um
      # parametro adicionado no nativo e esquecido no Kotlin fica inalcancavel,
      # e um numero que se mexe em silencio aponta um slider para outro
      # controle. Ja aconteceu uma vez.
      - run: tools/check_params.py

  # Os pesos da separacao nao entram no APK nem no repositorio: 38 MB que todo
  # mundo baixaria, inclusive quem so importa instrumental. Ficam numa release
  # propria e o app busca na primeira vez que precisa.
  #
  # Upstream publica so um .tar.bz2, e o Android nao tem bzip2 na biblioteca
  # padrao. Entao este passo extrai uma vez e republica os dois .onnx soltos,
  # com o hash que o app confere antes de usar. Roda uma vez: se a release ja
  # tem os arquivos, nao faz nada.
  modelos:
    name: Modelos de separacao
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Verificar se ja estao publicados
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          have=0
          if gh release view models-latest --repo "${{ github.repository }}" \
               --json assets --jq '.assets[].name' 2>/dev/null \
               | grep -qx "vocals.fp16.onnx"; then
            have=1
          fi
          echo "have=$have" >> "$GITHUB_OUTPUT"

      - name: Extrair do upstream
        if: steps.check.outputs.have == '0'
        run: |
          set -eo pipefail
          URL=https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/sherpa-onnx-spleeter-2stems-fp16.tar.bz2
          curl -sSL --retry 3 -o models.tar.bz2 "$URL"
          tar xjf models.tar.bz2
          mkdir -p models
          mv sherpa-onnx-spleeter-2stems-fp16/*.onnx models/
          cd models
          sha256sum *.onnx | tee SHA256SUMS
          # Os mesmos hashes estao em ModelStore.kt; se mudarem, o app recusa
          # o arquivo em vez de separar mal, e este passo falha aqui primeiro
          grep -q "24cef84aedcd1fe87c0b743ef3370ad34dc1fabf6c9014d6128a75a538c7b668  vocals.fp16.onnx" SHA256SUMS
          grep -q "d14cea55793cc531a5875f5f4da08207d1c5ab9292e8e0099a104eecb014fcc0  accompaniment.fp16.onnx" SHA256SUMS

      - name: Publicar
        if: steps.check.outputs.have == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-latest
          name: Modelos de separacao de vocal
          body: >
            Pesos do Spleeter 2stems (Deezer, MIT) convertidos para ONNX pelo
            projeto sherpa-onnx (Apache 2.0), reempacotados soltos porque o
            Android nao le .tar.bz2. O app confere o SHA-256 antes de usar.
          prerelease: true
          files: |
            models/vocals.fp16.onnx
            models/accompaniment.fp16.onnx
            models/SHA256SUMS

  apk:
    name: APK
    runs-on: ubuntu-latest
    needs: dsp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # O runner ja traz o SDK em ANDROID_HOME. A action setup-android nao e
      # usada porque ela instala o pacote legado "tools", que saiu do
      # repositorio do SDK e faz o passo inteiro falhar antes do build.
      # O download do NDK sai truncado de vez em quando ("unknown archive"),
      # e sao 600 MB: uma tentativa so transforma um soluco de rede em build
      # vermelha. O pacote pela metade e descartado antes de tentar de novo.
      - name: NDK e CMake
        run: |
          set -eo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -r | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null; then
              echo "ndk: $(ls "$ANDROID_HOME/ndk")"
              exit 0
            fi
            echo "::warning::instalacao do NDK falhou (tentativa $attempt)"
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973"
            sleep $((attempt * 15))
          done
          echo "::error::NDK nao instalou em 3 tentativas"
          exit 1

      # O numero da execucao vira versionCode, entao toda build e distinguivel
      # e o app sabe se o que esta publicado e mais novo do que ele
      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      # Nome fixo e tag fixa: o link de download nunca muda e nem o repositorio
      # nem a lista de releases cresce a cada build
      - name: Preparar APK e manifesto de atualizacao
        if: github.event_name != 'pull_request'
        run: |
          set -eo pipefail
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/auravox-latest.apk
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          jq -n \
            --argjson versionCode "${{ github.run_number }}" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/${{ github.repository }}/releases/download/apk-latest/auravox-latest.apk" \
            --arg notes "$(git log -1 --pretty=%s)" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, notes: $notes}' \
            > release-apk/latest.json
          cat release-apk/latest.json

      - name: Publicar release rolante
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AuraVox — última versão
          body: >
            APK gerada automaticamente pela CI a partir do último commit da
            main. O app se atualiza sozinho a partir daqui.
          prerelease: true
          files: |
            release-apk/auravox-latest.apk
            release-apk/latest.json

      # A action cria a tag quando ela falta, mas nao a move quando ja existe.
      # Deixa-la para tras ancora a historia inteira daquele commit: objetos que
      # o repositorio ja descartou continuam alcancaveis por ela, e um clone
      # limpo volta a baixar tudo. Mover e um PATCH, nunca um delete, para a
      # release nunca ficar sem tag.
      - name: Ancorar a tag no commit atual
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/apk-latest" \
            -f sha="${{ github.sha }}" -F force=true > /dev/null
          echo "apk-latest agora em ${{ github.sha }}"
