name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  dsp:
    name: Testes de DSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Os headers de dsp/, track/ e karaoke/ nao dependem de Android, entao a
      # parte que pode quebrar em silencio e testada sem emulador nem SDK
      - run: tools/run_tests.sh

  apk:
    name: APK
    runs-on: ubuntu-latest
    needs: dsp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # O runner ja traz o SDK em ANDROID_HOME. A action setup-android nao e
      # usada porque ela instala o pacote legado "tools", que saiu do
      # repositorio do SDK e faz o passo inteiro falhar antes do build.
      - name: NDK e CMake
        run: |
          set -eo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -r | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          echo "ndk: $(ls "$ANDROID_HOME/ndk")"

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: auravox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Uma tag vN.N.N publica o APK como release, que e o link estavel para
      # mandar para quem vai testar
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
